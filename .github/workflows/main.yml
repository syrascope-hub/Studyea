name: Build StudyEA APK from zip

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['*.zip', '.github/workflows/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip the project (newest .zip in repo root)
        run: |
          ZIP=$(ls -t ./*.zip 2>/dev/null | head -n1)
          if [ -z "$ZIP" ]; then
            echo "::error::No .zip file found in the repository root."
            exit 1
          fi
          echo "Using $ZIP"
          rm -rf app && mkdir app
          unzip -q "$ZIP" -d app
          PUB=$(find app -name pubspec.yaml | awk '{print length, $0}' | sort -n | head -n1 | cut -d' ' -f2-)
          if [ -z "$PUB" ]; then
            echo "::error::pubspec.yaml not found inside the zip."
            exit 1
          fi
          DIR=$(dirname "$PUB")
          echo "Project directory: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files if missing
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org app.studyea .
          fi
          rm -f test/widget_test.dart

      - name: Prepare release signing key (optional)
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/studyea.jks"
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=$RUNNER_TEMP/studyea.jks"
            } > android/key.properties
          else
            echo "::warning::No KEYSTORE_BASE64 secret; the APK is signed with a debug key and cannot update an installed copy."
          fi

      - name: Patch Android settings (minSdk, manifest, signing)
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tools/patch_android.py

      - name: Resolve packages
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Analyze Dart sources
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: studyea-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
