name: Build Studyea APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Unzip source (studyea.zip)
        run: |
          rm -rf _src && mkdir _src
          unzip -q studyea.zip -d _src
          P=$(find _src -name pubspec.yaml -not -path '*/.*' | head -1)
          test -n "$P" || { echo "pubspec.yaml not found in zip"; exit 1; }
          echo "APP_DIR=$(dirname "$P")" >> "$GITHUB_ENV"

      - name: Generate Android platform
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter create --platforms=android --project-name studyea --org com.studyea .
          rm -rf test

      - name: Icon + Android patches
        working-directory: ${{ env.APP_DIR }}
        run: |
          cp -r android_icons/* android/app/src/main/res/
          python3 tools/patch_android.py

      - name: Pub get
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: studyea-apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
