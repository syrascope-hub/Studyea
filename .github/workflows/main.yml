
name: StudyEA - Extract and Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "studyea-palette.zip"
      - ".github/workflows/build-apk.yml"
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Extract StudyEA and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Check ZIP file
        shell: bash
        run: |
          if [ ! -f "studyea-palette.zip" ]; then
            echo "::error::studyea-palette.zip was not found in repository root."
            exit 1
          fi

      - name: Extract project ZIP
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir -p extracted
          unzip -q studyea-palette.zip -d extracted

          PUBSPEC="$(find extracted -type f -name pubspec.yaml -print -quit)"

          if [ -z "$PUBSPEC" ]; then
            echo "::error::pubspec.yaml was not found in the ZIP archive."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Flutter project found at: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter version
        run: flutter --version

      - name: Install Flutter dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Analyze project
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze --no-pub
        continue-on-error: true

      - name: Verify Android project
        shell: bash
        run: |
          if [ ! -f "$PROJECT_DIR/android/gradlew" ]; then
            echo "::error::Android Gradle wrapper not found."
            exit 1
          fi

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyEA-Android-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
